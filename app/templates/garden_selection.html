<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Select Your Garden — Capenta</title>

  <style>
    :root{
      --bg-1:#05060a;
      --bg-2:#0b1115;
      --card:#111418;
      --accent:#34C759;
      --muted:#9aa4b2;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Inter,system-ui,Roboto,Arial;
      background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
      color:white;
      min-height:100vh;
      padding:28px;
    }

    /* TOP BAR */
    .topbar{
      max-width:1100px;
      margin:0 auto 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      text-decoration:none;
      color:white;
    }

    .brand-img{
      height:36px;
      width:auto;
      filter:drop-shadow(0 0 6px rgba(52,199,89,0.25));
    }

    .brand span{
      font-size:24px;
      font-weight:700;
    }

    .logout-btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 20px;
      border-radius:999px;
      background:#1E1E1E;
      border:1px solid #2a2a2a;
      color:#e5e7eb;
      text-decoration:none;
      cursor:pointer;
      transition:.2s;
      font-size:14px;
    }

    .logout-btn:hover{
      border-color:var(--accent);
      background:#0a0f12;
      transform:translateY(-1px);
    }

    /* CONTENT WRAP */
    .wrap{
      max-width:850px;
      margin:0 auto;
    }

    .slogan{
      color:#b8b8b8;
      margin-bottom:10px;
      font-size:18px;
      text-align:center;
    }

    /* Titel + Add Garden row */
    .header-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:40px;
    }

    .title-main{
      font-size:36px;
      font-weight:700;
      color:white;
      text-align:center;
      flex:1;
    }

    .header-spacer{
      width:120px; /* ongeveer breedte van Add-knop zodat titel mooi centreert */
    }

    .add-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 20px;
      border-radius:14px;
      border:none;
      background:#1F3C26;
      color:#ffffff;
      font-size:14px;
      cursor:pointer;
      transition:filter .2s,transform .1s;
      white-space:nowrap;
    }

    .add-btn:hover{
      filter:brightness(1.08);
      transform:translateY(-1px);
    }

    /* PLUS icon */
    .add-btn-icon{
      width:18px;
      height:18px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.5);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:16px;
      line-height:1;
    }

    /* MAIN GARDEN CARD */
    .main-card{
      position:relative;
      width:100%;
      max-width:480px;
      margin:0 auto 40px;
      aspect-ratio:1/1;
      border-radius:26px;
      overflow:hidden;
      cursor:pointer;
      transition:.25s;
      border:1px solid var(--accent);
      background:linear-gradient(180deg,#1F3C26 0%,#16301E 100%);
    }

    .main-card:hover{
      transform:scale(1.02);
      box-shadow:0 0 40px rgba(52,199,89,0.25);
    }

    .card-bg{
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom right,#1E1E1E,#181818,#121212);
      opacity:0.15;
    }

    .card-leaf{
      position:absolute;
      top:32px;
      left:32px;
      opacity:0.1;
    }

    .main-content{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:32px;
      padding-bottom:80px; /* ruimte voor bar onderaan */
      text-align:center;
    }

    .g-name{
      font-size:40px;
      font-weight:700;
      margin-bottom:8px;
    }

    .g-address{
      font-size:14px;
      color:#cfcfcf;
    }

    .main-bottom-bar{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:16px 24px;
      border-top:1px solid rgba(255,255,255,0.1);
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:14px;
      color:#e5e7eb;
    }

    /* OTHER GARDENS */
    .other-title{
      color:#929292;
      margin-bottom:12px;
      text-align:left;
    }

    .scroll-row{
      display:flex;
      gap:18px;
      overflow-x:auto;
      padding-bottom:12px;
    }

    .scroll-row::-webkit-scrollbar{display:none}

    .small-card{
      position:relative;
      flex-shrink:0;
      width:250px;
      height:250px;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      transition:.2s;
      border:1px solid var(--accent);
      background:linear-gradient(180deg,#1F3C26 0%,#16301E 100%);
    }

    .small-card:hover{
      transform:scale(1.05);
      box-shadow:0 0 25px rgba(52,199,89,0.15);
    }

    .small-content{
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:24px;
      padding-bottom:70px;
      text-align:center;
    }

    .small-name{
      font-size:24px;
      font-weight:700;
      margin-bottom:4px;
    }

    .small-address{
      font-size:12px;
      color:#b6b6b6;
    }

    .small-bottom-bar{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:12px 20px;
      border-top:1px solid rgba(255,255,255,0.1);
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:12px;
      color:#e5e7eb;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <a href="{{ url_for('main.garden_selection') }}" class="brand">
      <img class="brand-img"
           src="{{ url_for('static', filename='img/logo.png') }}"
           alt="Capenta logo">
      <span>Capenta</span>
    </a>

    <a class="logout-btn" href="{{ url_for('main.logout') }}">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           stroke="#e5e7eb" fill="none" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 12v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>
        <path d="M10 12l3-3-3-3"/>
        <path d="M13 9H3"/>
      </svg>
      Logout
    </a>
  </div>
