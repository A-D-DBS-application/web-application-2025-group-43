<!doctype html>
<html lang="nl" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>{% block title %}Capenta Garden Robot{% endblock %}</title>

  <!-- Tailwind + Figma-styling uit jullie ZIP -->
  <link rel="stylesheet"
        href="{{ url_for('static', filename='styles/index.css') }}">
  <link rel="stylesheet"
        href="{{ url_for('static', filename='styles/globals.css') }}">

  <!-- Basisfont + background fallback -->
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: #020817;
      color: #e2e8f0d4;
      margin: 0;
    }
  </style>

</head>
<body class="bg-[#020817] text-slate-100">
  <!-- Global Language Switcher -->
  {% include '_language_switcher.html' %}
  
  {% block content %}{% endblock %}
</body>
</html>
