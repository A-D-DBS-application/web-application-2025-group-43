<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — Capenta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/profile.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/language_switcher.css') }}">
</head>
<body>
  {% include '_language_switcher.html' %}
  <div class="page">
    <!-- Topbar met back -->
    <div class="topbar">
      <div class="topbar-left">
        <form method="get" action="{% if last_robot_serial %}{{ url_for('dashboard.dashboard', serial_number=last_robot_serial) }}{% else %}{{ url_for('garden.garden_selection') }}{% endif %}">
          <button class="back-btn" type="submit" title="Back">
            <span>←</span>
          </button>
        </form>
      </div>
    </div>

    <div class="card-wrap" style="margin-top: 0;">
      <section class="profile-card">
        <!-- Header with avatar, name, email -->
        <div class="profile-header">
          <div class="avatar">{{ initials }}</div>
          <div>
            <div class="header-name">{{ name }}</div>
            <div class="header-email">{{ email }}</div>
          </div>
        </div>

        <!-- Fields (read only) -->
        <div class="fields">
          <div>
            <div class="field-label">{{ t('name') }}</div>
            <div class="field-box">{{ name }}</div>
          </div>

          <div>
            <div class="field-label">{{ t('email') }}</div>
            <div class="field-box">{{ email }}</div>
          </div>

          <div>
            <div class="field-label">{{ t('phone') }}</div>
            <div class="field-box">{{ phone }}</div>
          </div>

          <div>
            <div class="field-label">{{ t('address') }}</div>
            <div class="field-box">{{ address }}</div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
