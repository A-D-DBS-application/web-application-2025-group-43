<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile — Capenta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1:#05060a;
      --bg-2:#0b1115;
      --card:#15171f;
      --card-inner:#0f1116;
      --border:#252836;
      --border-soft:#1b1e2a;
      --accent:#34C759;
      --accent-soft:rgba(52,199,89,0.16);
      --text:#f9fbff;
      --muted:#9aa4b2;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    body{
      font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    .page{
      min-height:100vh;
      padding:24px 16px 32px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .topbar{
      width:100%;
      max-width:1100px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:24px;
    }

    .topbar-left,
    .topbar-right{
      width:56px;
      display:flex;
      align-items:center;
      justify-content:flex-start;
    }

    .topbar-right{
      justify-content:flex-end;
    }

    .back-btn{
      width:40px;
      height:40px;
      border-radius:999px;
      border:1px solid var(--border);
      background:#1e1f26;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      color:var(--muted);
      transition:border .12s ease,background .12s ease,color .12s ease,transform .12s ease;
    }

    .back-btn:hover{
      border-color:var(--accent);
      color:var(--text);
      transform:translateY(-1px);
    }

    .back-btn span{
      font-size:18px;
    }

    .topbar-center{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo-pill{
      width:34px;
      height:34px;
      border-radius:12px;
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .logo-pill img{
      max-width:22px;
      max-height:22px;
    }

    .logo-text{
      font-size:22px;
      font-weight:700;
      letter-spacing:.02em;
    }

    .page-title{
      margin-top:8px;
      text-align:center;
      font-size:32px;
      font-weight:700;
    }

    .card-wrap{
      width:100%;
      display:flex;
      justify-content:center;
      margin-top:16px;
    }

    .profile-card{
      width:100%;
      max-width:720px;
      border-radius:22px;
      background:var(--card);
      border:1px solid var(--border);
      padding:32px 32px 30px;
      box-shadow:0 26px 70px rgba(0,0,0,0.55);
    }

    .profile-header{
      display:flex;
      align-items:center;
      gap:18px;
      padding-bottom:22px;
      border-bottom:1px solid var(--border-soft);
      margin-bottom:22px;
    }

    .avatar{
      width:64px;
      height:64px;
      border-radius:999px;
      background:var(--accent-soft);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:26px;
      font-weight:600;
      color:var(--accent);
    }

    .header-name{
      font-size:24px;
      font-weight:600;
      margin-bottom:2px;
    }

    .header-email{
      font-size:14px;
      color:var(--muted);
    }

    .fields{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .field-label{
      font-size:13px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .field-box{
      width:100%;
      padding:10px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--card-inner);
      color:var(--text);
      font-size:15px;
    }

    @media (max-width:640px){
      .profile-card{padding:24px 18px;}
      .topbar{margin-bottom:16px;}
      .page-title{font-size:26px;}
    }
  </style>
</head>
<body>
  {% include '_language_switcher.html' %}
  <div class="page">
    <!-- Topbar met back -->
    <div class="topbar">
      <div class="topbar-left">
        <form method="get" action="{% if last_robot_serial %}{{ url_for('dashboard.dashboard', serial_number=last_robot_serial) }}{% else %}{{ url_for('garden.garden_selection') }}{% endif %}">
          <button class="back-btn" type="submit" title="Back">
            <span>←</span>
          </button>
        </form>
      </div>
    </div>

    <div class="card-wrap" style="margin-top: 0;">
      <section class="profile-card">
        <!-- Header with avatar, name, email -->
        <div class="profile-header">
          <div class="avatar">{{ initials }}</div>
          <div>
            <div class="header-name">{{ name }}</div>
            <div class="header-email">{{ email }}</div>
          </div>
        </div>

        <!-- Fields (read only) -->
        <div class="fields">
          <div>
            <div class="field-label">{{ t('name') }}</div>
            <div class="field-box">{{ name }}</div>
          </div>

          <div>
            <div class="field-label">{{ t('email') }}</div>
            <div class="field-box">{{ email }}</div>
          </div>

          <div>
            <div class="field-label">{{ t('phone') }}</div>
            <div class="field-box">{{ phone }}</div>
          </div>

          <div>
            <div class="field-label">{{ t('address') }}</div>
            <div class="field-box">{{ address }}</div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
