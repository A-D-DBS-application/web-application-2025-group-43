<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Capenta – {{ t('add_garden') }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/add_garden.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/language_switcher.css') }}">
</head>

<body class="min-h-screen text-white">
  <div class="max-w-7xl mx-auto px-6 py-6">

    <!-- Top bar (same layout as edit garden) -->
    <header class="grid grid-cols-[1fr_auto_1fr] items-center mb-8">
      <!-- Left: Back -->
      <div class="flex items-center">
        <a href="{{ url_for('garden.garden_selection') }}"
           class="w-10 h-10 rounded-full bg-[#1E1E1E] border border-gray-700
                  flex items-center justify-center hover:border-[#34C759] transition-all"
           aria-label="{{ t('back') }}">
          <span class="text-gray-400 text-xl">&lsaquo;</span>
        </a>
      </div>

      <!-- Center: Title -->
      <h1 class="text-white text-2xl font-semibold text-center">
        {{ t('add_garden') }}
      </h1>

      <!-- Right: Logout + Language switcher -->
      <div class="flex items-center justify-end gap-3">


        {% include '_language_switcher.html' %}
      </div>
    </header>

    <!-- Card -->
    <main class="max-w-xl mx-auto">
      <div class="bg-[#1E1E1E] rounded-2xl p-8 border border-gray-800">

        <h2 class="text-white text-2xl font-bold mb-2">{{ t('new_garden') }}</h2>
        <p class="text-gray-400 mb-8">{{ t('garden_details_subtitle') }}</p>

        <form method="post" action="{{ url_for('garden.add_garden') }}" class="space-y-6">

          <!-- Garden name -->
          <div>
            <label for="garden_name" class="block text-gray-300 mb-2">{{ t('garden_name') }}</label>
            <input
              type="text"
              id="garden_name"
              name="garden_name"
              placeholder="{{ t('garden_name_placeholder') }}"
              required
              class="w-full px-4 py-3 bg-[#0F1116] border border-gray-700
                     rounded-xl text-white placeholder-gray-500
                     focus:outline-none focus:border-[#34C759]
                     focus:ring-2 focus:ring-[#34C759]/20 transition-all"
            >
          </div>

          <!-- Address -->
          <div>
            <label for="address" class="block text-gray-300 mb-2">{{ t('address') }}</label>
            <input
              type="text"
              id="address"
              name="address"
              placeholder="{{ t('address_placeholder') }}"
              class="w-full px-4 py-3 bg-[#0F1116] border border-gray-700
                     rounded-xl text-white placeholder-gray-500
                     focus:outline-none focus:border-[#34C759]
                     focus:ring-2 focus:ring-[#34C759]/20 transition-all"
            >
          </div>

          <!-- Size of garden (KEEP name="size" as in your original add garden) -->
          <div>
            <label for="size" class="block text-gray-300 mb-2">{{ t('size_of_garden') }}</label>
            <div class="relative">
              <input
                type="number"
                id="size"
                name="size"
                step="0.01"
                min="0"
                placeholder="{{ t('size_placeholder') }}"
                class="w-full px-4 py-3 pr-12 bg-[#0F1116] border border-gray-700
                       rounded-xl text-white placeholder-gray-500
                       focus:outline-none focus:border-[#34C759]
                       focus:ring-2 focus:ring-[#34C759]/20 transition-all"
              >
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">m²</span>
            </div>
          </div>

          <!-- Actions (same look as edit garden) -->
          <div class="flex items-center gap-4 mt-8">
            <a href="{{ url_for('garden.garden_selection') }}"
               class="flex-1 text-center bg-transparent border border-gray-700 text-gray-300
                      hover:border-gray-600 hover:bg-gray-800/50 px-6 h-11 rounded-xl
                      flex items-center justify-center text-sm transition-all">
              {{ t('cancel') }}
            </a>

            <button type="submit"
              class="flex-1 bg-[#34C759] hover:brightness-110 text-white px-6 h-11
                     rounded-xl text-sm font-semibold transition-all">
              {{ t('save_garden') }}
            </button>
          </div>

        </form>

      </div>
    </main>

  </div>
</body>
</html>
