<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Capenta – {{ t('add_garden') }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1:#05060a;
      --bg-2:#070b11;
      --card:#141820;
      --accent:#34C759;
      --muted:#9aa4b2;
      --text:#f9fbff;
      --radius:28px;
      --shadow-card:0 40px 90px rgba(0,0,0,0.9);
      --shadow-btn:0 18px 40px rgba(52,199,89,0.45);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:
        radial-gradient(800px 800px at 15% 10%, rgba(52,199,89,0.12), transparent 70%),
        radial-gradient(700px 700px at 90% 90%, rgba(52,199,89,0.08), transparent 70%),
        linear-gradient(135deg,var(--bg-1),var(--bg-2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    .page{
      min-height:100vh;
      padding:24px 16px 40px;
    }

    .top-bar{
      max-width:960px;
      margin:0 auto 32px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    /* Back arrow */
    .back-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:40px;
      height:40px;
      border-radius:999px;
      border:1px solid #374151;
      background:#111827;
      color:#e5e7eb;
      text-decoration:none;
      cursor:pointer;
      transition:border-color .15s ease, transform .1s ease, background .15s ease;
    }
    .back-btn:hover{
      border-color:var(--accent);
      background:#020617;
      transform:translateY(-1px);
    }
    .back-icon{
      width:12px;
      height:12px;
      border-left:2px solid #e5e7eb;
      border-bottom:2px solid #e5e7eb;
      transform:rotate(45deg);
    }

    .top-title{
      font-size:24px;
      font-weight:600;
      text-align:center;
      flex:1;
    }

    .logout-btn{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:0 16px;
      height:40px;
      border-radius:12px;
      border:1px solid #374151;
      background:#1E1E1E;
      color:#e5e7eb;
      font-size:14px;
      text-decoration:none;
      cursor:pointer;
      transition:border-color .15s ease, color .15s ease, background .15s ease, transform .1s ease;
    }
    .logout-btn:hover{
      border-color:var(--accent);
      color:#fff;
      transform:translateY(-1px);
    }
    .logout-icon{
      width:14px;
      height:14px;
      border:1.5px solid #9ca3af;
      border-radius:4px;
      position:relative;
    }
    .logout-icon::before{
      content:"";
      position:absolute;
      inset:3px;
      border-right:1.5px solid #9ca3af;
      border-top:1.5px solid #9ca3af;
      transform:rotate(45deg);
    }

    .content{
      max-width:760px;
      margin:0 auto;
    }

    .card{
      margin-top:20px;
      border-radius:var(--radius);
      background:radial-gradient(circle at top left, rgba(255,255,255,0.02), transparent 55%),
                 var(--card);
      box-shadow:var(--shadow-card);
      border:1px solid rgba(255,255,255,0.05);
      padding:32px 32px 28px;
    }

    .card h1{
      font-size:26px;
      font-weight:600;
      margin-bottom:4px;
    }

    .card-subtitle{
      font-size:14px;
      color:var(--muted);
      margin-bottom:26px;
    }

    .field{
      margin-bottom:18px;
      font-size:14px;
    }
    .field label{
      display:block;
      margin-bottom:6px;
      color:var(--muted);
      font-weight:500;
    }
    .field input{
      width:100%;
      border-radius:999px;
      padding:12px 16px;
      border:1px solid #252f3c;
      background:#050812;
      color:var(--text);
      font-size:14px;
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    .field input::placeholder{
      color:#6b7280;
    }
    .field input:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 1px rgba(52,199,89,0.35);
    }

    .size-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
    }

    .unit-pill{
      align-self:stretch;
      min-width:64px;
      border-radius:999px;
      border:1px solid #252f3c;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:13px;
      color:var(--muted);
      background:#050812;
    }

    .actions{
      margin-top:26px;
      display:flex;
      gap:16px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    .btn-secondary,
    .btn-primary{
      border-radius:999px;
      padding:12px 24px;
      font-size:14px;
      font-weight:500;
      border:none;
      cursor:pointer;
      transition:transform .1s ease, filter .15s ease, background .15s ease;
    }

    .btn-secondary{
      background:#111827;
      color:#e5e7eb;
      border:1px solid #374151;
      text-decoration:none;
    }
    .btn-secondary:hover{
      filter:brightness(1.05);
      transform:translateY(-1px);
    }

    .btn-primary{
      background:linear-gradient(135deg,#55de68,var(--accent));
      color:#041006;
      box-shadow:var(--shadow-btn);
    }
    .btn-primary:hover{
      filter:brightness(1.05);
      transform:translateY(-1px);
    }

    @media (max-width:640px){
      .top-bar{
        gap:12px;
      }
      .top-title{
        font-size:20px;
      }
      .card{
        padding:24px 18px 22px;
      }
      .actions{
        flex-direction:column-reverse;
        align-items:stretch;
      }
      .btn-secondary,
      .btn-primary{
        width:100%;
        justify-content:center;
        text-align:center;
      }
    }
  </style>
</head>

<body>
  {% include '_language_switcher.html' %}

  <div class="page">
    <!-- Top bar -->
    <header class="top-bar">
      <!-- Back naar garden selection -->
      <a href="{{ url_for('garden.garden_selection') }}" class="back-btn" aria-label="{{ t('back') }}">
        <span class="back-icon"></span>
      </a>

      <div class="top-title">{{ t('add_garden') }}</div>

      <!-- Logout -->
      <a href="{{ url_for('auth.logout') }}" class="logout-btn">
        <span class="logout-icon"></span>
        <span>{{ t('logout') }}</span>
      </a>
    </header>

    <main class="content">
      <section class="card">
        <h1>{{ t('new_garden') }}</h1>
        <p class="card-subtitle">{{ t('garden_details_subtitle') }}</p>

        <form method="post" action="{{ url_for('garden.add_garden') }}">
          <!-- Garden name -->
          <div class="field">
            <label for="garden_name">{{ t('garden_name') }}</label>
            <input
              type="text"
              id="garden_name"
              name="garden_name"
              placeholder="{{ t('garden_name_placeholder') }}"
              required
            >
          </div>

          <!-- Address -->
          <div class="field">
            <label for="address">{{ t('address') }}</label>
            <input
              type="text"
              id="address"
              name="address"
              placeholder="{{ t('address_placeholder') }}"
            >
          </div>

          <!-- Size of garden -->
          <div class="field">
            <label for="size">{{ t('size_of_garden') }}</label>
            <div class="size-row">
              <input
                type="number"
                id="size"
                name="size"
                step="0.01"
                min="0"
                placeholder="{{ t('size_placeholder') }}"
              >
              <div class="unit-pill">m²</div>
            </div>
          </div>

          <!-- Buttons -->
          <div class="actions">
            <!-- Cancel: back to overview -->
            <a href="{{ url_for('garden.garden_selection') }}" class="btn-secondary">{{ t('cancel') }}</a>

            <!-- Save Garden: submit form -->
            <button type="submit" class="btn-primary">{{ t('save_garden') }}</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
