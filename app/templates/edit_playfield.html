<!doctype html>
<html lang="{{ lang or 'en' }}">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ t('edit_playfield') }} – Capenta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background:#05060a;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }

    /* ✅ Force language switcher inline next to logout */
    .lang-inline,
    .lang-inline *{
      flex-shrink:0;
    }
    .lang-inline{
      display:flex;
      align-items:center;
      gap:10px;
      white-space:nowrap;
    }
    .lang-inline .language-switcher,
    .lang-inline #language-switcher,
    .lang-inline .lang-switcher,
    .lang-inline [data-language-switcher]{
      position:static !important;
      inset:auto !important;
      top:auto !important;
      right:auto !important;
      bottom:auto !important;
      left:auto !important;
      transform:none !important;
      margin:0 !important;
      display:flex !important;
      align-items:center !important;
      gap:10px !important;
      white-space:nowrap !important;
    }

    /* Hide language switcher on mobile */
    @media (max-width: 640px) {
      .lang-inline {
        display: none !important;
      }
    }
  </style>
</head>

<body class="min-h-screen text-white">
  <div class="max-w-7xl mx-auto px-6 py-6">

    <!-- Top bar -->
    <header class="grid grid-cols-[1fr_auto_1fr] items-center mb-8">

      <!-- Left: Back -->
      <div class="flex items-center">
        <a href="{{ url_for('playfield.playfield_selection', garden_id=garden.garden_id) }}"
           class="w-10 h-10 rounded-full bg-[#1E1E1E] border border-gray-700 flex items-center justify-center hover:border-[#34C759] transition-all">
          <span class="text-gray-400 text-xl">&lsaquo;</span>
        </a>
      </div>

      <!-- Center: Title (always centered) -->
      <h1 class="text-white text-2xl font-semibold text-center">{{ t('edit_playfield') }}</h1>

      <!-- Right: Logout + Language switcher -->
      <div class="flex items-center justify-end gap-3">
        <a href="{{ url_for('auth.logout') }}"
           class="flex items-center gap-2 px-4 h-10 rounded-xl bg-[#1E1E1E]
                  border border-gray-700 hover:border-[#34C759] transition-all group whitespace-nowrap">
          <span class="text-gray-400 group-hover:text-[#34C759] transition-colors text-sm">⇥</span>
          <span class="text-gray-300 text-sm group-hover:text-white transition-colors">
            {{ t('logout') }}
          </span>
        </a>

        <div class="lang-inline">
          {% include '_language_switcher.html' %}
        </div>
      </div>

    </header>

    <!-- Main card -->
    <main class="max-w-xl mx-auto">
      <div class="bg-[#1E1E1E] rounded-2xl p-8 border border-gray-800">

        <h2 class="text-white mb-2 text-2xl font-bold">{{ t('update_playfield') }}</h2>
        <p class="text-gray-400 mb-8">{{ t('adjust_details_and_save') }}</p>

        <!-- FORM -->
        <form method="post" class="space-y-6">

          <!-- Playfield name -->
          <div>
            <label class="block text-gray-300 mb-2">{{ t('playfield_name') }}</label>
            <input
              type="text"
              name="robot_name"
              value="{{ zone.robot_name }}"
              required
              class="w-full px-4 py-3 bg-[#0F1116] border border-gray-700 rounded-xl text-white
                     placeholder-gray-500 focus:outline-none focus:border-[#34C759]
                     focus:ring-2 focus:ring-[#34C759]/20 transition-all" />
          </div>

          <!-- Size -->
          <div>
            <label class="block text-gray-300 mb-2">{{ t('size_of_playfield') }}</label>
            <div class="relative">
              <input
                type="number"
                step="0.1"
                min="0"
                name="area_playfield"
                value="1"
                readonly
                class="w-full px-4 py-3 pr-12 bg-[#0F1116] border border-gray-700 rounded-xl text-gray-400 cursor-not-allowed" />
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">m²</span>
            </div>
          </div>

          <!-- Crop / plants dropdown -->
          <div>
            <label class="block text-gray-300 mb-2">{{ t('crop_plants') }}</label>
            <select
              name="plant_name"
              class="w-full px-4 py-3 bg-[#0F1116] border border-gray-700 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[#34C759] focus:ring-2 focus:ring-[#34C759]/20 transition-all appearance-none cursor-pointer"
            >
              <option value="">-- {{ t('select_a_crop') }} --</option>
              {% for plant in plants %}
                <option value="{{ plant.plant_name }}" {% if zone.plant_name == plant.plant_name %}selected{% endif %}>{{ t(plant.display_name) }}</option>
              {% endfor %}
            </select>
            <style>
              select {
                background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%9ca3af' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
                background-repeat: no-repeat;
                background-position: right 0.75rem center;
                background-size: 1.5em 1.5em;
                padding-right: 2.5rem;
              }
            </style>
          </div>

          <!-- Buttons -->
          <div class="flex items-center gap-4 mt-8">
            <a href="{{ url_for('playfield.playfield_selection', garden_id=garden.garden_id) }}"
               class="flex-1 text-center bg-transparent border border-gray-700 text-gray-300
                      hover:border-gray-600 hover:bg-gray-800/50 px-6 h-11 rounded-xl flex items-center
                      justify-center text-sm transition-all">
              {{ t('cancel') }}
            </a>

            <button type="submit"
              class="flex-1 bg-[#34C759] hover:brightness-110 text-white px-6 h-11 rounded-xl
                     text-sm font-semibold transition-all">
              {{ t('save_changes') }}
            </button>
          </div>

        </form>

      </div>
    </main>

  </div>
</body>

</html>
