<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Capenta – Register</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1:#05060a;
      --bg-2:#070b11;
      --card:#10141c;
      --accent:#4bd463;
      --muted:#9aa4b2;
      --text:#f9fbff;
      --radius:22px;
      --shadow-card:0 32px 80px rgba(0,0,0,0.75);
      --shadow-btn:0 18px 40px rgba(75,212,99,0.45);
      --max-width:460px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:linear-gradient(135deg,var(--bg-1),var(--bg-2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    .page{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:32px 16px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      max-width:var(--max-width);
      width:100%;
      padding:30px 28px;
      box-shadow:var(--shadow-card);
      border:1px solid rgba(255,255,255,0.02);
    }

    h1{font-size:24px;font-weight:600;margin-bottom:10px;}
    .subtitle{color:var(--muted);font-size:14px;margin-bottom:26px;}

    .field{margin-bottom:16px;}
    label{display:block;margin-bottom:6px;color:var(--muted);font-size:14px;}
    input{
      width:100%;
      border-radius:999px;
      padding:12px 16px;
      background:#0b1117;
      border:1px solid #253040;
      color:var(--text);
      font-size:14px;
    }

    .btn{
      width:100%;
      margin-top:10px;
      border-radius:999px;
      padding:14px;
      border:none;
      background:linear-gradient(135deg,#55de68,var(--accent));
      color:#041006;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
      box-shadow:var(--shadow-btn);
    }

    .helper{
      margin-top:16px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }
    .helper a{
      color:var(--accent);
      text-decoration:none;
      font-weight:500;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h1>Create Account</h1>
      <p class="subtitle">Fill in the information to start using Capenta.</p>

      <form method="post" action="{{ url_for('auth.register') }}">
        
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input type="text" id="phone" name="phone">
        </div>

        <div class="field">
          <label for="adress">Address</label>
          <input type="text" id="adress" name="adress">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn">Create Account</button>

        <p class="helper">
          Already have an account?
          <a href="{{ url_for('auth.login') }}">Log in</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
