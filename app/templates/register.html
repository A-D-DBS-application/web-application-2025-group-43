<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Capenta – {{ t('register') }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1:#05060a;
      --bg-2:#070b11;
      --card:#10141c;
      --accent:#4bd463;
      --muted:#9aa4b2;
      --text:#f9fbff;
      --radius:28px;
      --shadow-card:0 36px 90px rgba(0,0,0,0.85);
      --shadow-btn:0 18px 40px rgba(75,212,99,0.45);
      --max-width:520px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}

    body{
      font-family:Inter,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:radial-gradient(800px 800px at 10% 10%, rgba(75,212,99,0.10), transparent 60%),
                 radial-gradient(900px 900px at 90% 90%, rgba(75,212,99,0.08), transparent 65%),
                 linear-gradient(135deg,var(--bg-1),var(--bg-2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 16px;
    }

    .card{
      max-width:var(--max-width);
      width:100%;
      background:radial-gradient(circle at top left, rgba(255,255,255,0.02), transparent 55%),
                 var(--card);
      border-radius:var(--radius);
      padding:32px 32px 26px;
      box-shadow:var(--shadow-card);
      border:1px solid rgba(255,255,255,0.03);
    }

    h1{
      font-size:26px;
      font-weight:600;
      margin-bottom:6px;
    }

    .subtitle{
      font-size:14px;
      color:var(--muted);
      margin-bottom:26px;
    }

    .field{
      margin-bottom:18px;
      font-size:14px;
    }

    .field label{
      display:block;
      margin-bottom:6px;
      color:var(--muted);
      font-weight:500;
    }

    /* Language Switcher Styles */
    .language-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 0;
    }
    
    .lang-btn {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      border-radius: 4px;
    }
    
    .lang-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.8);
    }
    
    .lang-btn.active {
      background: #34C759;
      color: white;
      border-color: #34C759;
    }
    
    .lang-btn.active:hover {
      background: #30B24F;
      border-color: #30B24F;
    }

    .field input{
      width:100%;
      border-radius:999px;
      padding:12px 16px;
      border:1px solid #252f3c;
      background:#060a10;
      color:var(--text);
      font-size:14px;
      outline:none;
    }

    .field input::placeholder{
      color:#6c7380;
    }

    .btn{
      margin-top:6px;
      width:100%;
      border:none;
      border-radius:999px;
      padding:14px 20px;
      font-size:15px;
      font-weight:600;
      background:linear-gradient(135deg,#55de68,var(--accent));
      color:#041006;
      cursor:pointer;
      box-shadow:var(--shadow-btn);
    }

    .helper{
      margin-top:18px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
    }
    .helper a{
      color:var(--accent);
      text-decoration:none;
      font-weight:500;
    }
  </style>
</head>

<body>
  <!-- Global Language Switcher -->
  <div class="language-switcher">
    <button 
      class="lang-btn lang-btn-en {% if lang == 'en' %}active{% endif %}"
      onclick="setLanguage('en')"
      style="margin-right: 0;">
      EN
    </button>
    <button 
      class="lang-btn lang-btn-nl {% if lang == 'nl' %}active{% endif %}"
      onclick="setLanguage('nl')">
      NL
    </button>
  </div>

  <div class="page">
    <div class="card">
      <h1>{{ t('create_account') }}</h1>
      <p class="subtitle">{{ t('fill_info') if lang == 'en' else 'Vul de informatie in om Capenta te gebruiken.' }}</p>

      <form method="post" action="{{ url_for('auth.register') }}">

        <div class="field">
          <label for="name">{{ t('name') }}</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="field">
          <label for="email">{{ t('email_address') }}</label>
          <input type="email" id="email" name="email" placeholder="email@domain.com" required>
        </div>

        <div class="field">
          <label for="phone">{{ t('phone') }}</label>
          <input type="text" id="phone" name="phone" placeholder="+32 ...">
        </div>

        <div class="field">
          <label for="adress">{{ t('address') }}</label>
          <input type="text" id="adress" name="adress" placeholder="Street, number, city">
        </div>

        <div class="field">
          <label for="password">{{ t('password') }}</label>
          <input type="password" id="password" name="password" placeholder="Choose a password" required>
        </div>

        <button type="submit" class="btn">{{ t('create_account') }}</button>

        <p class="helper">
          {{ t('already_have_account') }}
          <a href="{{ url_for('auth.login') }}">{{ t('login') }}</a>
        </p>
      </form>
    </div>
  </div>
  
  <script>
    function setLanguage(lang) {
      fetch(`/set-language/${lang}`, {
        method: 'GET',
        credentials: 'same-origin'
      }).then(() => {
        location.reload();
      });
    }
  </script>
</body>
</html>
