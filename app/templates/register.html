<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Capenta – {{ t('register') }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/register.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/language_switcher.css') }}">
</head>

<body>
  {% include '_language_switcher.html' %}

  <div class="page">
    <div class="card">
      <h1>{{ t('create_account') }}</h1>
      <p class="subtitle">{{ t('fill_info') if lang == 'en' else 'Vul de informatie in om Capenta te gebruiken.' }}</p>

      <form method="post" action="{{ url_for('auth.register') }}">

        <div class="field">
          <label for="name">{{ t('name') }}</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>

        <div class="field">
          <label for="email">{{ t('email_address') }}</label>
          <input type="email" id="email" name="email" placeholder="email@domain.com" required>
        </div>

        <div class="field">
          <label for="phone">{{ t('phone') }}</label>
          <input type="text" id="phone" name="phone" placeholder="+32 ...">
        </div>

        <div class="field">
          <label for="adress">{{ t('address') }}</label>
          <input type="text" id="adress" name="adress" placeholder="Street, number, city">
        </div>

        <button type="submit" class="btn">{{ t('create_account') }}</button>

        <p class="helper">
          {{ t('already_have_account') }}
          <a href="{{ url_for('auth.login') }}">{{ t('login') }}</a>
        </p>
      </form>
    </div>
  </div>
  
  <script>
    function setLanguage(lang) {
      fetch(`/set-language/${lang}`, {
        method: 'GET',
        credentials: 'same-origin'
      }).then(() => {
        location.reload();
      });
    }
  </script>
</body>
</html>
