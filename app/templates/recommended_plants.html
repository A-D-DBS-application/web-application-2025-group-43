<!doctype html>
<html lang="{{ lang or 'en' }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ t('recommended_plants') }} — Capenta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/recommended_plants.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/language_switcher.css') }}">
</head>
<body style="background: #0b1115;">
    <main class="main" style="margin-left: 0;">
        <header class="topbar">
            <a href="{{ url_for('dashboard.dashboard', serial_number=serial_number) }}" class="topbar-back" title="{{ t('back_to_dashboard') }}">
                ←
            </a>
            <h1 class="topbar-title">{{ t('recommended_plants') }}</h1>
            <div class="topbar-language">
              {% include '_language_switcher.html' %}
            </div>
        </header>

        <div class="main-scroll">
            <div class="recommendation-list">
                {% for plant in plant_rankings %}
                    <div class="recommendation-item {% if plant.key == current_plant_name %}current{% endif %}">
                        <div class="rec-icon">{{ icon_for_plant(plant.key) }}</div>
                        <div class="rec-details">
                            <div class="rec-name">{{ t(plant.name) }}</div>
                            <div class="rec-score-bar">
                                <div class="rec-score-fill" style="width: {{ plant.score }}%;"></div>
                            </div>
                        </div>
                        <div class="rec-score-value">{{ plant.score|round(1) }}%</div>
                    </div>
                {% else %}
                    <p>{{ t('no_recommendations') }}</p>
                {% endfor %}
            </div>
        </div>
    </main>

    <script>
      function setLanguage(language) {
        fetch(`/set-language/${language}`)
          .then(() => {
            location.reload();
          });
      }

      // Hide language switcher on scroll
      const mainScroll = document.querySelector('.main-scroll');
      const languageSwitcher = document.querySelector('.language-switcher');
      
      if (mainScroll && languageSwitcher) {
        mainScroll.addEventListener('scroll', () => {
          if (mainScroll.scrollTop > 50) {
            languageSwitcher.style.opacity = '0';
            languageSwitcher.style.pointerEvents = 'none';
          } else {
            languageSwitcher.style.opacity = '1';
            languageSwitcher.style.pointerEvents = 'auto';
          }
        });
      }
    </script>
</body>
</html>
