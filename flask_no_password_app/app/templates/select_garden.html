<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Select Your Garden — Capenta</title>
  <style>
    :root{--bg-1:#05060a;--bg-2:#0b1115;--card:#0f1417;--muted:#9aa4b2;--accent:#44d25f;--card-radius:14px;--gap:18px}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Roboto,Arial;background:linear-gradient(180deg,var(--bg-1),var(--bg-2));color:#e6eef6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px}
    .wrap{width:100%;max-width:1100px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title{display:flex;flex-direction:column}h1{margin:0;color:var(--accent);font-size:28px}p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:12px}.btn{background:linear-gradient(180deg,var(--accent),#28b454);border:0;color:#062018;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--gap)}.card{background:linear-gradient(180deg,rgba(255,255,255,0.01),rgba(255,255,255,0.02));border-radius:12px;padding:18px;border:1px solid rgba(255,255,255,0.03);box-shadow:0 12px 30px rgba(2,6,23,0.6);cursor:pointer;display:flex;flex-direction:column;gap:12px;align-items:flex-start}.card:hover{transform:translateY(-4px);transition:transform .14s}.thumb{width:100%;height:120px;border-radius:8px;background:#071018;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden}.meta{display:flex;align-items:center;justify-content:space-between;width:100%}.name{font-weight:700}.small{font-size:13px;color:var(--muted)}.empty{padding:28px;border-radius:12px;border:1px dashed rgba(255,255,255,0.03);text-align:center;color:var(--muted)}@media (max-width:520px){ .thumb{height:100px} .header{flex-direction:column;align-items:flex-start;gap:12px} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Select your garden</h1>
        <p>Choose which garden you want to manage</p>
      </div>
      <div class="actions">
        <button class="btn" id="createBtn">Create garden</button>
      </div>
    </div>

    <div class="grid" id="gardenGrid">
      <div class="card" data-id="1" onclick="openGarden(1)">
        <div class="thumb"><img src="{{ url_for('static', filename='img/garden-1.jpg') }}" alt="garden" style="width:100%;height:100%;object-fit:cover" /></div>
        <div class="meta"><div class="name">Front Yard</div><div class="small">2 devices</div></div>
        <div class="small">Last seen: 2 hours ago</div>
      </div>

      <div class="card" data-id="2" onclick="openGarden(2)">
        <div class="thumb"><img src="{{ url_for('static', filename='img/garden-2.jpg') }}" alt="garden" style="width:100%;height:100%;object-fit:cover" /></div>
        <div class="meta"><div class="name">Back Garden</div><div class="small">1 device</div></div>
        <div class="small">Last seen: online</div>
      </div>

      <div class="card empty" onclick="location.href='/gardens/new'">
        No gardens yet — click to create your first garden
      </div>
    </div>
  </div>

  <script>
    function openGarden(id){ location.href = '/dashboard/' + id; }
    document.getElementById('createBtn')?.addEventListener('click',()=> location.href='/gardens/new');
  </script>
</body>
</html>
