{% extends "base.html" %}

{% block title %}Login — Capenta{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Subtle background orbs (zoals in Figma) -->
  <div class="absolute inset-0 opacity-40 pointer-events-none">
    <div class="absolute top-20 left-10 w-32 h-32 rounded-full bg-[#34C759] blur-3xl"></div>
    <div class="absolute bottom-32 right-20 w-40 h-40 rounded-full bg-[#34C759] blur-3xl"></div>
    <div class="absolute top-1/2 left-1/3 w-24 h-24 rounded-full bg-teal-400 blur-3xl"></div>
  </div>

  <!-- Login card -->
  <div class="relative w-full max-w-[420px] z-10">
    <!-- Logo & branding -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 mb-3">
        <div class="w-10 h-10 rounded-full bg-[#34C759]/10 flex items-center justify-center border border-[#34C759]/40">
          <!-- Simpele leaf-icon vervanger -->
          <span class="text-[#34C759] text-2xl">🌿</span>
        </div>
        <h1 class="text-[#34C759] tracking-tight text-4xl font-bold">
          Capenta
        </h1>
      </div>
      <p class="text-gray-400">Autonomous Garden Robot</p>
    </div>

    <div class="rounded-3xl bg-white/5 border border-white/10 shadow-2xl shadow-black/40 backdrop-blur-xl p-8">
      <div class="mb-6">
        <h2 class="text-xl font-semibold tracking-tight mb-1">
          Welcome back
        </h2>
        <p class="text-sm text-gray-400">
          Sign in to manage your playfields and monitor your garden health.
        </p>
      </div>

      <form method="post" action="{{ url_for('login') }}" class="space-y-6">
        <!-- Email -->
        <div class="space-y-2">
          <label for="email" class="text-sm text-gray-300">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            placeholder="email@domain.com"
            class="w-full h-11 rounded-xl border border-gray-700 bg-[#0F1116] px-3 text-sm text-white placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-[#34C759] focus:border-transparent transition-all"
          >
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label for="password" class="text-sm text-gray-300">Password</label>
          <div class="relative">
            <input
              id="password"
              name="password"
              type="password"
              required
              placeholder="••••••••"
              class="w-full h-11 rounded-xl border border-gray-700 bg-[#0F1116] px-3 pr-10 text-sm text-white placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-[#34C759] focus:border-transparent transition-all"
            >
            <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none">
              <!-- icoontje als dummy -->
              <span class="text-gray-500 text-xs">👁</span>
            </div>
          </div>
        </div>

        <!-- Login button -->
        <button
          type="submit"
          class="w-full h-11 rounded-xl bg-[#34C759] text-black font-medium text-sm shadow-lg shadow-[#34C759]/20 hover:bg-[#2fb54f] transition-all hover:shadow-[#34C759]/40 hover:scale-[1.02]"
        >
          Log in
        </button>

        <div class="text-center">
          <button
            type="button"
            class="text-sm text-gray-400 hover:text-[#34C759] transition-colors"
          >
            Forgot password?
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
