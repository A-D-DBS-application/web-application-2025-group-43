<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Garden Robot</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1724;
      --muted:#9aa4b2;
      --accent:#20c997; /* groen accent */
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      --max-width:980px;
      --gap:28px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#07101a 0%,var(--bg) 100%);color:#e6eef6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:var(--max-width);margin:40px auto;padding:24px}
    .card{display:flex;gap:var(--gap);background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 40px rgba(2,6,23,.6);border:1px solid rgba(255,255,255,0.03)}
    .visual{flex:1;min-width:300px;padding:36px;background:
      linear-gradient(135deg, rgba(32,201,151,0.04), rgba(16,185,129,0.02));
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
    .visual img.logo{width:90px;margin-bottom:6px;filter:drop-shadow(0 6px 18px rgba(32,201,151,0.08))}
    .visual h1{margin:0;font-size:22px;color:var(--accent);letter-spacing:0.2px}
    .visual p{margin:0;color:var(--muted);max-width:320px;text-align:center;font-size:14px}
    .form-side{flex:1.1;padding:36px 34px}
    .title{font-size:20px;margin-bottom:6px;color:#e6eef6}
    .subtitle{color:var(--muted);margin-bottom:18px;font-size:13px}
    form{display:grid;gap:12px}
    label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
    .input{
      display:flex;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:var(--glass);
      gap:8px;color:#e6eef6;
    }
    .input input{border:0;background:transparent;outline:none;width:100%;font-size:15px;color:inherit}
    .actions{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;border:0;background:linear-gradient(90deg,var(--accent),#10b981);color:#062018;font-weight:700;cursor:pointer;
      box-shadow:0 8px 30px rgba(32,201,151,.12)
    }
    .btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(32,201,151,.12);box-shadow:none}
    .muted-link{font-size:13px;color:var(--muted);text-decoration:none}
    .divider{height:1px;background:rgba(255,255,255,0.03);margin:18px 0;border-radius:2px}
    .socials{display:flex;gap:10px}
    .socials button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:var(--muted);cursor:pointer}
    .small{font-size:13px;color:var(--muted)}
    @media (max-width:820px){
      .card{flex-direction:column}
      .visual{padding:22px}
      .form-side{padding:22px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-label="Login kaart">
      <div class="visual" aria-hidden="true">
        <img class="logo" src="{{ url_for('static', filename='img/logo-dark.svg') }}" alt="Logo" />
        <img src="{{ url_for('static', filename='img/robot-dark.svg') }}" alt="" style="width:220px;max-width:60%;filter:drop-shadow(0 14px 30px rgba(2,6,23,.6));" />
        <h1>Garden Robot</h1>
        <p>Beheer je robot en instellingen. Veilig inloggen om verder te gaan.</p>
      </div>

      <div class="form-side">
        <div class="title">Inloggen</div>
        <div class="subtitle">Voer je accountgegevens in</div>

        <form method="post" action="{{ url_for('auth.login') if false else '/login' }}">
          <!-- CSRF token (Flask-WTF) -->
          <!-- {{ form.csrf_token }} -->

          <div>
            <label for="email">E‑mail</label>
            <div class="input">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity:.7"><path d="M3 8.5l9 6 9-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <input id="email" name="email" type="email" placeholder="jij@voorbeeld.nl" required autocomplete="username" />
            </div>
          </div>

          <div>
            <label for="password">Wachtwoord</label>
            <div class="input" style="gap:8px">
              <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" id="togglePw" aria-label="Toon wachtwoord" style="background:none;border:0;cursor:pointer;color:var(--muted)">👁️</button>
            </div>
          </div>

          <div class="actions" style="margin-top:6px">
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">
              <input type="checkbox" name="remember" /> Onthoud mij
            </label>
            <a class="muted-link" href="/reset">Wachtwoord vergeten?</a>
          </div>

          <div style="margin-top:10px">
            <button class="btn" type="submit">Inloggen</button>
          </div>

          <div class="divider" aria-hidden="true"></div>

          <div style="display:flex;align-items:center;justify-content:space-between">
            <div class="small">Of log in met</div>
            <div class="socials" style="width:55%">
              <button type="button" title="Google">Google</button>
              <button type="button" title="GitHub">GitHub</button>
            </div>
          </div>

          <p style="margin-top:16px" class="small">Nog geen account? <a href="/register">Maak er een</a></p>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('togglePw')?.addEventListener('click',function(){
      const pw = document.getElementById('password');
      if(!pw) return;
      if(pw.type === 'password'){ pw.type = 'text'; this.textContent = '🙈'; }
      else { pw.type = 'password'; this.textContent = '👁️'; }
    });
  </script>
</body>
</html>
