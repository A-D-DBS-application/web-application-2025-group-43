<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Capenta</title>
  <style>
    :root{
      --bg-1:#05060a;
      --bg-2:#0b1115;
      --card:#0f1417;
      --muted:#9aa4b2;
      --accent:#44d25f; /* neon green */
      --accent-2:#28b454;
      --card-radius:18px;
      --card-w:420px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:
        radial-gradient(600px 300px at 10% 20%, rgba(68,210,95,0.03), transparent 8%),
        radial-gradient(500px 260px at 90% 80%, rgba(68,210,95,0.02), transparent 8%),
        linear-gradient(180deg,var(--bg-1),var(--bg-2));
      color:#e6eef6;
      display:grid;
      place-items:center;
      -webkit-font-smoothing:antialiased;
    }

    .container{width:100%;max-width:1100px;padding:48px;display:flex;flex-direction:column;align-items:center;gap:18px}

    .brand{display:flex;flex-direction:column;align-items:center;gap:8px}
    .brand img.logo{width:140px;filter:drop-shadow(0 8px 28px rgba(68,210,95,0.14))}
    .brand h1{margin:0;color:var(--accent);font-size:36px;letter-spacing:0.4px}
    .brand p{margin:0;color:var(--muted);font-size:14px}

    .card{
      width:var(--card-w);
      border-radius:var(--card-radius);
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:28px;
      box-shadow:
        0 30px 60px rgba(2,6,23,0.6),
        0 6px 20px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
    }

    form{display:flex;flex-direction:column;gap:14px}

    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}

    .field{
      position:relative;
    }

    .input{
      height:50px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 14px;
      border-radius:12px;
      background:rgba(5,8,10,0.6);
      border:1px solid rgba(255,255,255,0.03);
      box-shadow: 0 6px 18px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.01);
      color:inherit;
    }
    .input input{
      border:0;background:transparent;outline:none;width:100%;color:inherit;font-size:15px;
    }

    .eye-btn{
      background:transparent;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
    }

    .login-btn{
      height:52px;
      border-radius:12px;
      border:0;
      cursor:pointer;
      font-weight:700;
      color:#062018;
      background:linear-gradient(180deg,var(--accent),var(--accent-2));
      box-shadow: 0 18px 40px rgba(68,210,95,0.12), 0 6px 18px rgba(2,6,23,0.6);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .login-btn:hover{transform:translateY(-2px);box-shadow:0 26px 56px rgba(68,210,95,0.16)}
    .forgot{display:block;text-align:center;margin-top:10px;color:var(--muted);font-size:13px;text-decoration:none}

    /* small screens */
    @media (max-width:520px){
      .brand h1{font-size:28px}
      .card{width:92%}
      .brand img.logo{width:110px}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand" aria-hidden="false">
      <img class="logo" src="{{ url_for('static', filename='img/logo-dark.svg') }}" alt="Capenta logo" />
      <h1>Capenta</h1>
      <p>Autonomous Garden Robot</p>
    </div>

    <div class="card" role="form" aria-label="Login kaart">
      <form method="post" action="/login" autocomplete="on">
        <!-- {{ form.csrf_token }} -->

        <div class="field">
          <label for="email">Email</label>
          <div class="input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity:.8"><path d="M3 8.5l9 6 9-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input id="email" name="email" type="email" placeholder="email@domain.com" required autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input">
            <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="eye-btn" id="togglePw" aria-label="Toon wachtwoord">👁️</button>
          </div>
        </div>

        <button class="login-btn" type="submit">Log in</button>
        <a class="forgot" href="/reset">Forgot password?</a>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('togglePw')?.addEventListener('click',function(){
      const pw = document.getElementById('password');
      if(!pw) return;
      if(pw.type === 'password'){ pw.type = 'text'; this.textContent = '🙈'; }
      else { pw.type = 'password'; this.textContent = '👁️'; }
    });
  </script>
</body>
</html>
