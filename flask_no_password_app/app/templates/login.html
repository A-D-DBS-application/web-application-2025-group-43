<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Capenta – Login</title>

  <!-- (optioneel) Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg-1:#05060a;
      --bg-2:#070b11;
      --card:#10141c;
      --accent:#4bd463;
      --accent-soft:rgba(75,212,99,0.35);
      --muted:#9aa4b2;
      --text:#f9fbff;
      --radius:22px;
      --shadow-card:0 32px 80px rgba(0,0,0,0.75);
      --shadow-btn:0 18px 40px rgba(75,212,99,0.45);
      --max-width:420px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{height:100%}

    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      background:
        radial-gradient(600px 600px at 10% 20%, rgba(75,212,99,0.12), transparent 70%),
        radial-gradient(700px 700px at 90% 80%, rgba(75,212,99,0.10), transparent 70%),
        radial-gradient(900px 900px at 50% 40%, rgba(0,0,0,0.70), transparent 70%),
        linear-gradient(135deg,var(--bg-1),var(--bg-2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
      position:relative;
      overflow:hidden;
    }

    /* decoratieve bladeren */
    .leaf{
      position:absolute;
      border:1.5px solid rgba(75,212,99,0.15);
      border-radius:999px 999px 999px 999px;
      width:34px;
      height:22px;
      transform:rotate(-18deg);
      opacity:0.35;
    }
    .leaf::after{
      content:"";
      position:absolute;
      inset:7px 13px;
      border-left:1.5px solid rgba(75,212,99,0.25);
      border-radius:999px;
    }
    .leaf.l1{left:10%; top:22%;}
    .leaf.l2{left:26%; bottom:28%; transform:rotate(18deg);}
    .leaf.l3{right:12%; bottom:20%; transform:rotate(-18deg);}

    .brand{
      text-align:center;
      margin-bottom:40px;
    }

    .brand-logo{
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .logo-icon{
      width:28px;
      height:28px;
      border-radius:999px;
      border:2px solid var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }
    .logo-icon::before{
      /* klein blaadje */
      content:"";
      width:14px;
      height:10px;
      border-radius:999px;
      border:1.6px solid var(--accent);
      border-right-color:transparent;
      border-bottom-color:transparent;
      transform:rotate(-30deg);
    }

    .brand-title{
      font-size:40px;
      font-weight:700;
      letter-spacing:0.03em;
    }

    .brand-subtitle{
      margin-top:10px;
      font-size:18px;
      font-weight:400;
      color:var(--muted);
    }

    .card{
      background:radial-gradient(circle at top left, rgba(255,255,255,0.03), transparent 55%),
                 var(--card);
      border-radius:var(--radius);
      max-width:var(--max-width);
      width:100%;
      padding:34px 32px 26px;
      box-shadow:var(--shadow-card);
      border:1px solid rgba(255,255,255,0.02);
      position:relative;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-40px -30px;
      border-radius:calc(var(--radius) + 20px);
      background:radial-gradient(400px 220px at 50% 0%, rgba(75,212,99,0.16), transparent 70%);
      opacity:0.75;
      z-index:-1;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:26px;
      font-size:14px;
    }

    .field label{
      font-weight:500;
      color:var(--muted);
    }

    .input{
      position:relative;
    }

    .input input{
      width:100%;
      padding:14px 15px 14px 18px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,0.45);
      background:rgba(8,14,22,0.9);
      color:var(--text);
      font-size:14px;
      outline:none;
      transition:border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .input input::placeholder{
      color:#6c7380;
    }

    .input input:focus{
      border-color:var(--accent);
      background:rgba(10,18,30,1);
      box-shadow:0 0 0 1px var(--accent-soft), 0 14px 40px rgba(0,0,0,0.85);
    }

    .btn{
      display:block;
      width:100%;
      margin:0 auto;
      border-radius:999px;
      border:none;
      padding:14px 20px;
      font-size:15px;
      font-weight:600;
      letter-spacing:0.02em;
      background:linear-gradient(135deg,#55de68,var(--accent));
      color:#041006;
      box-shadow:var(--shadow-btn);
      cursor:pointer;
      transition:transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.03);
    }

    .btn:active{
      transform:translateY(0);
      box-shadow:0 10px 24px rgba(75,212,99,0.35);
    }

    .helper{
      margin-top:16px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }

    @media (max-width:480px){
      .brand-title{font-size:32px;}
      .brand-subtitle{font-size:16px;}
      .card{padding:26px 20px 22px;}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
    <div class="leaf l3"></div>

    <!-- Branding -->
    <div class="brand">
      <div class="brand-logo">
        <span class="logo-icon"></span>
        <span class="brand-title">Capenta</span>
      </div>
      <div class="brand-subtitle">Autonomous Garden Robot</div>
    </div>

    <!-- Login card -->
    <div class="card">
      <form action="/login" method="post">
        <!-- {% csrf_token %} of vergelijkbaar, indien je dat gebruikt -->
        <div class="field">
          <label for="email">Email</label>
          <div class="input">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="email@domain.com"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn">Log in</button>

        <p class="helper">You'll be logged in on this device.</p>
      </form>
    </div>
  </div>
</body>
</html>
