<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Select Your Garden — Capenta</title>

  <!-- IMPORT ICONS (Lucide SVG inline) -->
  <style>
    /* GLOBAL */
    :root{
      --bg-1:#05060a;
      --bg-2:#0b1115;
      --card:#111418;
      --accent:#34C759;
      --muted:#9aa4b2;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Inter,system-ui,Roboto,Arial;
      background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
      color:white;
      min-height:100vh;
      padding:28px;
    }

    /* TOP BAR */
    .topbar{
      max-width:1100px;
      margin:0 auto 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .brand{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .brand span{
      font-size:24px;
      font-weight:700;
    }
    .user-btn{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#1E1E1E;
      border:1px solid #2a2a2a;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:.2s;
    }
    .user-btn:hover{
      border-color:var(--accent);
    }

    /* CONTENT WRAPPER */
    .wrap{
      max-width:850px;
      margin:0 auto;
      text-align:center;
    }
    .slogan{
      color:#b8b8b8;
      margin-bottom:10px;
      font-size:18px;
    }
    .title-main{
      font-size:36px;
      font-weight:700;
      margin-bottom:40px;
    }

    /* MAIN GARDEN CARD */
    .main-card{
      position:relative;
      width:100%;
      max-width:420px;
      margin:0 auto 40px;
      aspect-ratio:1/1;
      border-radius:26px;
      overflow:hidden;
      cursor:pointer;
      transition:.25s;
    }
    .main-card:hover{
      transform:scale(1.02);
      box-shadow:0 0 40px rgba(52,199,89,0.25);
    }
    .card-bg{
      position:absolute;
      inset:0;
      background:linear-gradient(to bottom right,#1E1E1E,#181818,#121212);
    }
    .card-leaf{
      position:absolute;
      top:32px;
      left:32px;
      opacity:0.1;
    }
    .main-content{
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      padding:28px;
      text-align:left;
    }
    .status-row{
      display:flex;
      gap:10px;
      align-items:center;
      margin-bottom:6px;
    }
    .dot-online{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--accent);
      animation:pulse 1.6s infinite;
    }
    .dot-offline{
      width:10px;
      height:10px;
      border-radius:50%;
      background:gray;
    }
    @keyframes pulse{
      0%{opacity:.4}
      50%{opacity:1}
      100%{opacity:.4}
    }
    .g-name{
      font-size:30px;
      font-weight:700;
      margin-bottom:6px;
    }
    .g-address{
      font-size:14px;
      color:#cfcfcf;
    }

    /* OTHER GARDENS */
    .other-title{
      color:#929292;
      margin-bottom:12px;
      text-align:left;
    }
    .scroll-row{
      display:flex;
      gap:18px;
      overflow-x:auto;
      padding-bottom:12px;
    }
    .scroll-row::-webkit-scrollbar{display:none}

    .small-card{
      position:relative;
      flex-shrink:0;
      width:250px;
      height:250px;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      transition:.2s;
    }
    .small-card:hover{
      transform:scale(1.05);
      box-shadow:0 0 25px rgba(52,199,89,0.15);
    }
    .small-content{
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      padding:18px;
      text-align:left;
    }
    .small-name{
      font-size:18px;
      font-weight:600;
      margin-bottom:2px;
    }
    .small-address{
      font-size:12px;
      color:#b6b6b6;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <!-- Leaf icon (Lucide SVG) -->
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" stroke="var(--accent)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 21c-7.333-1.333-10-6.333-10-8 0-4 6-8 12-8s11 4 11 8c0 1.667-2.667 6.667-10 8v-6"></path>
      </svg>
      <span>Capenta</span>
    </div>

    <div class="user-btn">
      <!-- User icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" stroke="#b5b5b5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="wrap">

    <p class="slogan">Grow more, worry less.</p>
    <h1 class="title-main">Select Your Garden</h1>

    <!-- MAIN GARDEN (passed via Flask) -->
    <button class="main-card" onclick="location.href='/dashboard/{{ main_garden.id }}'">
      <div class="card-bg"></div>

      <!-- Background image -->
      <img src="{{ main_garden.image }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; mix-blend-mode:overlay; opacity:0.9"/>

      <!-- Decorative sprout icon -->
      <div class="card-leaf">
        <svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" stroke="var(--accent)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 20h10v10H7zM21 20h10v10H21z"/>
        </svg>
      </div>

      <!-- Text content -->
      <div class="main-content">
        <div class="status-row">
          <span style="color:#ccc;font-size:14px">{{ main_garden.playfields }} playfields</span>
          <span style="color:#555">•</span>

          {% if main_garden.status == "Online" %}
            <div class="dot-online"></div>
            <span style="color:var(--accent);font-size:14px">Online</span>
          {% else %}
            <div class="dot-offline"></div>
            <span style="color:gray;font-size:14px">Offline</span>
          {% endif %}
        </div>

        <div class="g-name">{{ main_garden.name }}</div>
        <div class="g-address">{{ main_garden.address }}</div>
      </div>
    </button>

    <!-- OTHER GARDENS -->
    <h3 class="other-title">Other Gardens</h3>

    <div class="scroll-row">
      {% for g in other_gardens %}
      <button class="small-card" onclick="location.href='/dashboard/{{ g.id }}'">
        <div class="card-bg"></div>
        <img src="{{ g.image }}" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.85; mix-blend-mode:overlay"/>

        <div class="small-content">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#ccc;margin-bottom:4px;">
            {{ g.playfields }} playfields
            <span style="color:#666">•</span>
            {% if g.status == "Online" %}
              <div class="dot-online" style="width:6px;height:6px"></div>
              <span style="color:var(--accent)">Online</span>
            {% else %}
              <div class="dot-offline" style="width:6px;height:6px"></div>
              <span style="color:gray">Offline</span>
            {% endif %}
          </div>

          <div class="small-name">{{ g.name }}</div>
          <div class="small-address">{{ g.address }}</div>
        </div>
      </button>
      {% endfor %}
    </div>

  </div>
</body>
</html>
